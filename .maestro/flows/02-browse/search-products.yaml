appId: com.lastbite.mobile
---
# Search products by keyword

# Login first
- runFlow:
    file: ../shared/login-foodsaver.yaml

# Navigate to search tab
- tapOn:
    id: "tab-search"
- waitForAnimationToEnd

# Type a search term
- tapOn:
    id: "search-input"
- inputText: "Nasi"

# Verify search results appear
- extendedWaitUntil:
    visible: "produk"
    timeout: 10000

# Clear search
- tapOn:
    id: "searchbar-clear"
    optional: true

# Search another term
- tapOn:
    id: "search-input"
- inputText: "Ayam"

# Verify new results
- extendedWaitUntil:
    visible: "produk"
    timeout: 10000

# Clear search
- tapOn:
    id: "searchbar-clear"
    optional: true

