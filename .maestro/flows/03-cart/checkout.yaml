appId: com.lastbite.mobile
---
# Complete checkout flow: add to cart → checkout → order success

# Login first
- runFlow:
    file: ../shared/login-foodsaver.yaml

# --- Step 1: Add product to cart ---
- tapOn:
    id: "product-card"
    index: 0
- waitForAnimationToEnd

# Add to cart
- tapOn:
    id: "add-to-cart-button"
- extendedWaitUntil:
    visible: "ditambahkan ke keranjang"
    timeout: 10000

# --- Step 2: Navigate to cart and checkout ---
- tapOn:
    id: "tab-cart"
- waitForAnimationToEnd

# Tap checkout button
- tapOn:
    text: 'Checkout'
    index: 0
    optional: true
- waitForAnimationToEnd

# --- Step 3: Checkout page ---
- assertVisible:
    id: "payment-summary"
- assertVisible:
    id: "confirm-button"

# Add optional notes
- tapOn:
    id: "notes-input"
- inputText: "Pisah bungkus ya"
- hideKeyboard

# --- Step 4: Confirm order ---
- tapOn:
    id: "confirm-button"

# Wait for order to be created
- extendedWaitUntil:
    visible: "Pesanan Berhasil"
    timeout: 15000

# Verify success elements
- assertVisible: "Pesanan Berhasil"

